{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "MarginSight economical serverless prototype - MOCK merchant data, private storage",
  "Resources": {
    "Memberships": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": true
        },
        "TimeToLiveSpecification": {
          "AttributeName": "expiresAt",
          "Enabled": true
        }
      }
    },
    "Catalog": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": true
        },
        "TimeToLiveSpecification": {
          "AttributeName": "expiresAt",
          "Enabled": true
        }
      }
    },
    "Ledger": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1SK",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": true
        },
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "ByStoreMonth",
            "KeySchema": [
              {
                "AttributeName": "GSI1PK",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "GSI1SK",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "expiresAt",
          "Enabled": true
        }
      }
    },
    "Jobs": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": true
        },
        "TimeToLiveSpecification": {
          "AttributeName": "expiresAt",
          "Enabled": true
        }
      }
    },
    "WebBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "IgnorePublicAcls": true,
          "BlockPublicPolicy": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        }
      }
    },
    "UploadsBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "IgnorePublicAcls": true,
          "BlockPublicPolicy": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "CorsConfiguration": {
          "CorsRules": [
            {
              "AllowedOrigins": [
                {
                  "Fn::Sub": "https://${Distribution.DomainName}"
                }
              ],
              "AllowedMethods": [
                "PUT",
                "GET",
                "HEAD"
              ],
              "AllowedHeaders": [
                "content-type"
              ],
              "MaxAge": 300
            }
          ]
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "ExpirePrototypeUploads",
              "Status": "Enabled",
              "ExpirationInDays": 30
            },
            {
              "Id": "ExpireGuestDemoUploads",
              "Status": "Enabled",
              "Prefix": "DEMO-GUEST-",
              "ExpirationInDays": 1
            }
          ]
        }
      }
    },
    "OAC": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Sub": "${AWS::StackName}-oac"
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "Rewrite": {
      "Type": "AWS::CloudFront::Function",
      "Properties": {
        "Name": {
          "Fn::Sub": "${AWS::StackName}-rewrite"
        },
        "AutoPublish": true,
        "FunctionConfig": {
          "Comment": "Next static export index rewrite",
          "Runtime": "cloudfront-js-2.0"
        },
        "FunctionCode": "function handler(event){var r=event.request;if(r.uri.endsWith('/'))r.uri+='index.html';else if(r.uri.indexOf('.')<0)r.uri+='/index.html';return r;}"
      }
    },
    "Distribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "DistributionConfig": {
          "Enabled": true,
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2",
          "PriceClass": "PriceClass_100",
          "Origins": [
            {
              "Id": "web",
              "DomainName": {
                "Fn::GetAtt": [
                  "WebBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Ref": "OAC"
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "web",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD",
              "OPTIONS"
            ],
            "CachedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6",
            "FunctionAssociations": [
              {
                "EventType": "viewer-request",
                "FunctionARN": {
                  "Fn::GetAtt": [
                    "Rewrite",
                    "FunctionARN"
                  ]
                }
              }
            ]
          },
          "ViewerCertificate": {
            "CloudFrontDefaultCertificate": true
          }
        }
      }
    },
    "WebPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "WebBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${WebBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                  }
                }
              }
            }
          ]
        }
      }
    },
    "UserPool": {
      "Type": "AWS::Cognito::UserPool",
      "Properties": {
        "UserPoolName": {
          "Fn::Sub": "${AWS::StackName}-users"
        },
        "UsernameAttributes": [
          "email"
        ],
        "AutoVerifiedAttributes": [
          "email"
        ],
        "AdminCreateUserConfig": {
          "AllowAdminCreateUserOnly": false
        },
        "Policies": {
          "PasswordPolicy": {
            "MinimumLength": 12,
            "RequireLowercase": true,
            "RequireUppercase": true,
            "RequireNumbers": true,
            "RequireSymbols": true
          }
        },
        "UserPoolTier": "LITE"
      }
    },
    "AuthDomain": {
      "Type": "AWS::Cognito::UserPoolDomain",
      "Properties": {
        "Domain": {
          "Fn::Sub": "marginsight-${AWS::AccountId}"
        },
        "UserPoolId": {
          "Ref": "UserPool"
        }
      }
    },
    "ResourceServer": {
      "Type": "AWS::Cognito::UserPoolResourceServer",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "Identifier": "marginsight",
        "Name": "MarginSight API",
        "Scopes": [
          {
            "ScopeName": "api",
            "ScopeDescription": "Access stores with verified membership"
          }
        ]
      }
    },
    "AppClient": {
      "Type": "AWS::Cognito::UserPoolClient",
      "DependsOn": "ResourceServer",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "ClientName": "MarginSight web",
        "GenerateSecret": false,
        "SupportedIdentityProviders": [
          "COGNITO"
        ],
        "AllowedOAuthFlowsUserPoolClient": true,
        "AllowedOAuthFlows": [
          "code"
        ],
        "AllowedOAuthScopes": [
          "openid",
          "email",
          "marginsight/api"
        ],
        "CallbackURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "LogoutURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "AccessTokenValidity": 1,
        "TokenValidityUnits": {
          "AccessToken": "hours"
        },
        "PreventUserExistenceErrors": "ENABLED",
        "EnableTokenRevocation": true
      }
    },
    "HttpApi": {
      "Type": "AWS::Serverless::HttpApi",
      "Properties": {
        "StageName": "$default",
        "CorsConfiguration": {
          "AllowOrigins": [
            {
              "Fn::Sub": "https://${Distribution.DomainName}"
            }
          ],
          "AllowHeaders": [
            "authorization",
            "content-type"
          ],
          "AllowMethods": [
            "GET",
            "POST",
            "OPTIONS"
          ]
        },
        "DefaultRouteSettings": {
          "ThrottlingBurstLimit": 10,
          "ThrottlingRateLimit": 5
        },
        "Auth": {
          "DefaultAuthorizer": "Cognito",
          "Authorizers": {
            "Cognito": {
              "JwtConfiguration": {
                "issuer": {
                  "Fn::Sub": "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
                },
                "audience": [
                  {
                    "Ref": "AppClient"
                  }
                ]
              },
              "IdentitySource": "$request.header.Authorization",
              "AuthorizationScopes": [
                "marginsight/api"
              ]
            }
          }
        }
      }
    },
    "ImportDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "ImportQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 360,
        "MessageRetentionPeriod": 86400,
        "SqsManagedSseEnabled": true,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "ImportDLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "OCRDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "OCRQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 360,
        "MessageRetentionPeriod": 86400,
        "SqsManagedSseEnabled": true,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "OCRDLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "LineDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "LineQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 360,
        "MessageRetentionPeriod": 86400,
        "SqsManagedSseEnabled": true,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "LineDLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    }
  },
  "Outputs": {
    "ApiUrl": {
      "Value": {
        "Fn::Sub": "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
      }
    },
    "WebUrl": {
      "Value": {
        "Fn::Sub": "https://${Distribution.DomainName}"
      }
    },
    "WebBucket": {
      "Value": {
        "Ref": "WebBucket"
      }
    },
    "UploadsBucket": {
      "Value": {
        "Ref": "UploadsBucket"
      }
    },
    "DistributionId": {
      "Value": {
        "Ref": "Distribution"
      }
    },
    "UserPoolId": {
      "Value": {
        "Ref": "UserPool"
      }
    },
    "ClientId": {
      "Value": {
        "Ref": "AppClient"
      }
    },
    "AuthDomain": {
      "Value": {
        "Fn::Sub": "https://marginsight-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
      }
    },
    "MembershipsTable": {
      "Value": {
        "Ref": "Memberships"
      }
    },
    "CatalogTable": {
      "Value": {
        "Ref": "Catalog"
      }
    },
    "LedgerTable": {
      "Value": {
        "Ref": "Ledger"
      }
    },
    "JobsTable": {
      "Value": {
        "Ref": "Jobs"
      }
    },
    "ImportQueueUrl": {
      "Value": {
        "Ref": "ImportQueue"
      }
    },
    "OCRQueueUrl": {
      "Value": {
        "Ref": "OCRQueue"
      }
    },
    "LineQueueUrl": {
      "Value": {
        "Ref": "LineQueue"
      }
    }
  }
}
